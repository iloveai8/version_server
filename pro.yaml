apiVersion: v1
kind: ConfigMap
metadata:
  data:
    env: pro
  labels:
    app: gsv
    env: pro
  name: gsv-config-pro-v
  namespace: jackpotland
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: gsv
    env: pro
  name: gsv-service-pro-v
  namespace: jackpotland
spec:
  ports:
  - name: http-19091
    port: 19091
    protocol: TCP
    targetPort: 9091
  selector:
    app: gsv
    env: pro
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gsv
    env: pro
  name: gsv-deployment-pro-v
  namespace: jackpotland
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: gsv
      env: pro
  strategy:
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 50%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: gsv
        env: pro
    spec:
      containers:
      - env:
        - name: env
          valueFrom:
            configMapKeyRef:
              key: env
              name: gsv-config-pro-v
        - name: vsn
          valueFrom:
            configMapKeyRef:
              key: vsn
              name: gsv-config-pro-v
        image: harbor.nuclearport.com/jackpotland/game_slots_vsn:latest
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /heartbeat
            port: 9091
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: gsv-pod
        ports:
        - containerPort: 9091
          name: http-9091
          protocol: TCP
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /heartbeat
            port: 9091
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 100m
            memory: 100Mi
          requests:
            cpu: 20m
            memory: 50Mi
      imagePullSecrets:
      - name: jackpotland-image-repository-secret
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    app: gsv
    env: pro
  name: gsv-hpa-pro-v
  namespace: jackpotland
spec:
  maxReplicas: 10
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 85
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gsv-deployment-pro-v
