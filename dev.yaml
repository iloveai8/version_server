apiVersion: v1
kind: ConfigMap
metadata:
  data:
    env: dev
  labels:
    app: gsv
    env: dev
  name: gsv-config-dev-v
  namespace: jackpotland
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: gsv
    env: dev
  name: gsv-service-dev-v
  namespace: jackpotland
spec:
  ports:
  - name: http-19091
    port: 19091
    protocol: TCP
    targetPort: 9091
  selector:
    app: gsv
    env: dev
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gsv
    env: dev
  name: gsv-deployment-dev-v
  namespace: jackpotland
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: gsv
      env: dev
  strategy:
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 50%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: gsv
        env: dev
    spec:
      containers:
      - env:
        - name: env
          valueFrom:
            configMapKeyRef:
              key: env
              name: gsv-config-dev-v
        - name: vsn
          valueFrom:
            configMapKeyRef:
              key: vsn
              name: gsv-config-dev-v
        image: harbor.nuclearport.com/jackpotland/game_slots_vsn:latest
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /heartbeat
            port: 9091
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: gsv-pod
        ports:
        - containerPort: 9091
          name: http-9091
          protocol: TCP
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /heartbeat
            port: 9091
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 50m
            memory: 50Mi
          requests:
            cpu: 10m
            memory: 25Mi
      imagePullSecrets:
      - name: jackpotland-image-repository-secret
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
