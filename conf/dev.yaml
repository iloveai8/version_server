# 生产环境
app:
    runMode: "debug"

server:
    ip: ""
    port: 9091

redis:
  masterName: ""
  password: ""
  hosts:
    - "gs-redis.dz9dz0.ng.0001.use2.cache.amazonaws.com:6379"
  db: 0
  poolSize: 5

log:
    fileEnable: true
    fileName: "./logs/gs_vsn.log"
    fileLevel: info

    consoleEnable: true
    consoleLevel: debug

    maxSize: 20
    maxBackups: 10
    maxAges: 30
    compress: true
    jsonEnable: true

ggeoip:
    name: "ggeoip.mmdb"
    path: "./data/"
    url: "https://geoip.ftsview.com/GeoLite2-City.mmdb"
#    url: "https://geoip.ftsview.com/GeoLite2-Country.mmdb"
    duration: 1 #hour
    scope : 1 #0country 1city


