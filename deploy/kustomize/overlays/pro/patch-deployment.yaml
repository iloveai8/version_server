kind: Deployment
apiVersion: apps/v1
metadata:
    name: gsv-deployment
    namespace: jackpotland
    labels:
        app: gsv-deployment
spec:
    replicas: 1
    selector:
        matchLabels:
            app: gsv-deployment
    template:
        metadata:
            labels:
                app: gsv-deployment
        spec:
            containers:
                -   name: gsv-pod
                    imagePullPolicy: Always
                    image: 'harbor.nuclearport.com/jackpotland/game_slots_vsn:1.0.1'
                    ports:
                        -   name: http-9091
                            containerPort: 9091
                            protocol: TCP
                    env:
                        -   name: env
                            valueFrom:
                                configMapKeyRef:
                                    name: gsv-config
                                    key: env
                        -   name: vsn
                            valueFrom:
                                configMapKeyRef:
                                    name: gsv-config
                                    key: vsn
                    resources:
                        limits:
                            cpu: 100m
                            memory: 200Mi
                        requests:
                            cpu: 50m
                            memory: 50Mi
                    livenessProbe:
                        httpGet:
                            path: /heartbeat
                            port: 9091
                            scheme: HTTP
                        initialDelaySeconds: 10
                        timeoutSeconds: 1
                        periodSeconds: 10
                        successThreshold: 1
                        failureThreshold: 3
                    readinessProbe:
                        httpGet:
                            path: /heartbeat
                            port: 50600
                        periodSeconds: 10
                        successThreshold: 1
                        timeoutSeconds: 1
                        failureThreshold: 10
                volumeMounts: []
            volumes: []
            restartPolicy: Always
            terminationGracePeriodSeconds: 30
            imagePullSecrets:
                -   name: jackpotland-image-repository-secret
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 25%
            maxSurge: 50%
