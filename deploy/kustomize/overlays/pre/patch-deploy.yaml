kind: Deployment
apiVersion: apps/v1
metadata:
  name: gsv-deploy
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
      maxSurge: 50%
  template:
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      containers:
        - name: gsv-deploy
          image: 'harbor.nuclearport.com/jackpotland/gsv:pre'
          imagePullPolicy: Always
          ports:
            - name: http-9091
              containerPort: 9091
              protocol: TCP
          env:
            - name: ip
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
            - name: env
              valueFrom:
                configMapKeyRef:
                  name: gsv-cm
                  key: env
            - name: ver
              valueFrom:
                configMapKeyRef:
                  name: gsv-cm
                  key: ver
          resources:
            limits:
              cpu: 200m
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 100Mi
          livenessProbe:
            httpGet:
              path: /heartbeat
              port: 9091
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
      imagePullSecrets:
        - name: gsv-secret

