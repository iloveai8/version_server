kind: Deployment
apiVersion: apps/v1
metadata:
  name: gsv-deployment
spec:
  template:
    spec:
      containers:
        - name: gsv-pod
          livenessProbe:
            httpGet:
              path: /heartbeat
              port: 9091
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /heartbeat
              port: 9091
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 10