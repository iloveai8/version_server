apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
    name: aman
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: aman
    minReplicas: 1
    maxReplicas: 10
    metrics:
        -   type: Resource
            resource:
                name: cpu
                target:
                    type: Utilization
                    averageUtilization: 80