apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
    labels:
        app: gsv====
    name: '---jackpotlandgsv-deploymentjackpotland---'
    namespace: jackpotland===
spec:
    maxReplicas: 3
    metrics:
        -   resource:
                name: cpu
                target:
                    averageUtilization: 85
                    type: Utilization
            type: Resource
    minReplicas: 1
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: '---jackpotlandgsv-deploymentjackpotland---'