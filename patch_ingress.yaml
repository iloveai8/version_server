kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: payment-ingress
  namespace: base-service
  annotations:
    alb.ingress.kubernetes.io/actions.payment-canary: >
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"prod-payment-service-svc-17","servicePort":50100,"weight":100}]}}
    alb.ingress.kubernetes.io/conditions.payment-canary: >
      [{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"app_id","values":["100009","100096"]}}]
    alb.ingress.kubernetes.io/certificate-arn: >-
      arn:aws:acm:us-east-2:392975326882:certificate/828eec7f-325b-44c2-9a84-a8176e26020a
    alb.ingress.kubernetes.io/healthcheck-path: /heartbeat
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    kubernetes.io/ingress.class: alb
    kubesphere.io/creator: panzhiqiang
  finalizers:
    - ingress.k8s.aws/resources
spec:
  rules:
    - host: temp-payment.akgoo.net
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: payment-canary
                port:
                  name: use-annotation
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: prod-payment-service-svc-17
                port:
                  number: 50100