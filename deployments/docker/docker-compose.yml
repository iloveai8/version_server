# Docker Compose 配置
#
# Game Slots Version Server 本地开发环境
#
# 使用方法：
#   docker-compose up -d

version: '3.8'

services:
  # Redis 服务
  redis:
    image: redis:7-alpine
    container_name: game-slots-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - game-slots-network

  # Game Slots VSN 服务
  app:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    container_name: game-slots-vsn
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - LOG_LEVEL=debug
      - REDIS_ADDR=redis:6379
      - REDIS_DB=0
      - ENVIRONMENT=dev
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - game-slots-network
    restart: unless-stopped

  # Prometheus (可选)
  prometheus:
    image: prom/prometheus:latest
    container_name: game-slots-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - game-slots-network
    profiles:
      - metrics

  # Grafana (可选)
  grafana:
    image: grafana/grafana:latest
    container_name: game-slots-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - game-slots-network
    profiles:
      - metrics

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  game-slots-network:
    driver: bridge
