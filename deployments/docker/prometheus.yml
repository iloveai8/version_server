# Prometheus 配置文件
#
# 用于监控 Game Slots Version Server

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 监控 Game Slots VSN 服务
  - job_name: 'game-slots-vsn'
    static_configs:
      - targets: ['app:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # 监控 Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
