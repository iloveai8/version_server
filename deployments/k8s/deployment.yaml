# Kubernetes Deployment 配置
#
# Game Slots Version Server 部署配置
#
# 使用方法：
#   kubectl apply -f deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-slots-vsn
  namespace: default
  labels:
    app: game-slots-vsn
    version: v2
spec:
  # 副本数量
  replicas: 3

  # 部署策略
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # 选择器
  selector:
    matchLabels:
      app: game-slots-vsn

  # Pod 模板
  template:
    metadata:
      labels:
        app: game-slots-vsn
        version: v2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"

    spec:
      # 容器配置
      containers:
      - name: game-slots-vsn
        image: game-slots-vsn:latest
        imagePullPolicy: IfNotPresent

        # 环境变量
        env:
        - name: GIN_MODE
          value: "release"
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: SERVER_PORT
          value: "8080"
        - name: LOG_LEVEL
          value: "info"

        # 从 ConfigMap 读取配置
        envFrom:
        - configMapRef:
            name: game-slots-vsn-config

        # 从 Secret 读取敏感配置
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: game-slots-vsn-secret
              key: redis-password

        # 端口配置
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        # 健康检查
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        # 资源限制
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        # 优雅关闭
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5

      # 优雅终止时间
      terminationGracePeriodSeconds: 30

---
# Service 配置
apiVersion: v1
kind: Service
metadata:
  name: game-slots-vsn
  namespace: default
  labels:
    app: game-slots-vsn
spec:
  type: ClusterIP
  selector:
    app: game-slots-vsn
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP

---
# HorizontalPodAutoscaler 配置
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: game-slots-vsn-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: game-slots-vsn
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# PodDisruptionBudget 配置
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: game-slots-vsn-pdb
  namespace: default
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: game-slots-vsn
