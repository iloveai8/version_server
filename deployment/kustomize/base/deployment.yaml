apiVersion: apps/v1
kind: Deployment
metadata:
    name: aman
spec:
    replicas: 1
    template:
        spec:
            containers:
                -   name: aman
                    imagePullPolicy: IfNotPresent
                    ports:
                        -   containerPort: 50600
                    lifecycle:
                        preStop:
                            exec:
                                command: ["sleep", "30"]
            terminationGracePeriodSeconds: 30
            imagePullSecrets:
                -   name: admin-secret